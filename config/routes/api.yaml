    controller: App\Controller\Api\RatingApiController::getUserRating
    methods: [GET]
    requirements:
        id: '\d+'

api_article_rating_stats_no_locale:
    path: /api/articles/{id}/rating/stats
    controller: App\Controller\Api\RatingApiController::getArticleRatingStats
    methods: [GET]
    requirements:
        id: '\d+'

api_article_delete_rating_no_locale:
