api_platform:
    title: Hello API Platform
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    swagger:
        api_keys:
            apiKey:
                name: Authorization
                type: header
            JWT:
                name: Authorization
                type: header
        swagger_ui_extra_configuration:
            securityDefinitions:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                    description: 'Enter JWT Bearer token'